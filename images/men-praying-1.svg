<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4d2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1419;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#c19a3d;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#1a4d2e;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#skyGradient)"/>
  <ellipse cx="400" cy="200" rx="300" ry="200" fill="url(#lightGlow)"/>
  
  <!-- Ground -->
  <rect y="450" width="800" height="150" fill="#0a0f11" opacity="0.8"/>
  
  <!-- Group of Men Praying (Silhouettes) -->
  
  <!-- Man 1 - Center, kneeling with hands raised -->
  <g transform="translate(400, 350)">
    <ellipse cx="0" cy="100" rx="40" ry="10" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-30" r="25" fill="#2d5a3d"/>
    <rect x="-20" y="-5" width="40" height="60" rx="5" fill="#2d5a3d"/>
    <rect x="-25" y="55" width="20" height="45" rx="5" fill="#2d5a3d"/>
    <rect x="5" y="55" width="20" height="45" rx="5" fill="#2d5a3d"/>
    <!-- Arms raised -->
    <rect x="-35" y="-50" width="15" height="50" rx="5" fill="#2d5a3d" transform="rotate(-45 -27.5 -25)"/>
    <rect x="20" y="-50" width="15" height="50" rx="5" fill="#2d5a3d" transform="rotate(45 27.5 -25)"/>
    <!-- Light rays above -->
    <line x1="0" y1="-60" x2="0" y2="-100" stroke="#c19a3d" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Man 2 - Left, kneeling with head bowed -->
  <g transform="translate(250, 370)">
    <ellipse cx="0" cy="90" rx="35" ry="8" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-20" r="22" fill="#3a6b4a"/>
    <rect x="-18" y="2" width="36" height="55" rx="5" fill="#3a6b4a"/>
    <rect x="-22" y="57" width="18" height="40" rx="5" fill="#3a6b4a"/>
    <rect x="4" y="57" width="18" height="40" rx="5" fill="#3a6b4a"/>
    <!-- Arms in prayer position -->
    <rect x="-8" y="-15" width="16" height="35" rx="3" fill="#3a6b4a"/>
  </g>
  
  <!-- Man 3 - Right, standing with hands clasped -->
  <g transform="translate(550, 330)">
    <ellipse cx="0" cy="130" rx="35" ry="8" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-30" r="23" fill="#3a6b4a"/>
    <rect x="-18" y="-5" width="36" height="70" rx="5" fill="#3a6b4a"/>
    <rect x="-20" y="65" width="16" height="65" rx="5" fill="#3a6b4a"/>
    <rect x="4" y="65" width="16" height="65" rx="5" fill="#3a6b4a"/>
    <!-- Arms clasped in front -->
    <rect x="-10" y="5" width="20" height="40" rx="3" fill="#2d5a3d"/>
  </g>
  
  <!-- Man 4 - Far left, kneeling -->
  <g transform="translate(150, 380)" opacity="0.8">
    <ellipse cx="0" cy="85" rx="30" ry="7" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-18" r="20" fill="#4a7b5a"/>
    <rect x="-16" y="0" width="32" height="50" rx="5" fill="#4a7b5a"/>
    <rect x="-20" y="50" width="16" height="38" rx="5" fill="#4a7b5a"/>
    <rect x="4" y="50" width="16" height="38" rx="5" fill="#4a7b5a"/>
    <rect x="-30" y="-35" width="12" height="40" rx="5" fill="#4a7b5a" transform="rotate(-50 -24 -15)"/>
    <rect x="18" y="-35" width="12" height="40" rx="5" fill="#4a7b5a" transform="rotate(50 24 -15)"/>
  </g>
  
  <!-- Man 5 - Far right, kneeling with hands raised -->
  <g transform="translate(650, 375)" opacity="0.8">
    <ellipse cx="0" cy="88" rx="32" ry="7" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-22" r="21" fill="#4a7b5a"/>
    <rect x="-17" y="0" width="34" height="52" rx="5" fill="#4a7b5a"/>
    <rect x="-21" y="52" width="17" height="40" rx="5" fill="#4a7b5a"/>
    <rect x="4" y="52" width="17" height="40" rx="5" fill="#4a7b5a"/>
    <rect x="-32" y="-45" width="13" height="45" rx="5" fill="#4a7b5a" transform="rotate(-40 -25.5 -22.5)"/>
    <rect x="19" y="-45" width="13" height="45" rx="5" fill="#4a7b5a" transform="rotate(40 25.5 -22.5)"/>
  </g>
  
  <!-- Light beams from above -->
  <g opacity="0.3">
    <line x1="400" y1="0" x2="380" y2="300" stroke="#c19a3d" stroke-width="40"/>
    <line x1="400" y1="0" x2="420" y2="300" stroke="#c19a3d" stroke-width="40"/>
    <line x1="400" y1="0" x2="400" y2="300" stroke="#fff" stroke-width="20"/>
  </g>
  
  <!-- Scripture overlay -->
  <text x="400" y="550" font-family="Georgia, serif" font-size="20" fill="#c19a3d" 
        text-anchor="middle" font-style="italic">
    "When men return to the altar, lives are restored"
  </text>
</svg>