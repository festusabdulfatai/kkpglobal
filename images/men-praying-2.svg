<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Dawn/Morning -->
  <defs>
    <linearGradient id="dawnSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b6914;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c19a3d;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#1a4d2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#dawnSky)"/>
  
  <!-- Sun rising -->
  <circle cx="400" cy="150" r="60" fill="#c19a3d" opacity="0.7"/>
  <circle cx="400" cy="150" r="80" fill="#c19a3d" opacity="0.3"/>
  
  <!-- Ground -->
  <ellipse cx="400" cy="550" rx="400" ry="50" fill="#0f1419" opacity="0.6"/>
  
  <!-- Circle of men praying together -->
  
  <!-- Man 1 - Top -->
  <g transform="translate(400, 250)">
    <ellipse cx="0" cy="85" rx="30" ry="8" fill="#000" opacity="0.2"/>
    <circle cx="0" cy="-25" r="22" fill="#2d5a3d"/>
    <rect x="-18" y="-2" width="36" height="55" rx="5" fill="#2d5a3d"/>
    <rect x="-20" y="53" width="17" height="35" rx="5" fill="#2d5a3d"/>
    <rect x="3" y="53" width="17" height="35" rx="5" fill="#2d5a3d"/>
    <!-- Praying hands -->
    <ellipse cx="0" cy="15" rx="12" ry="18" fill="#1a4d2e"/>
  </g>
  
  <!-- Man 2 - Right -->
  <g transform="translate(530, 320)">
    <ellipse cx="0" cy="80" rx="28" ry="8" fill="#000" opacity="0.2"/>
    <circle cx="0" cy="-22" r="21" fill="#3a6b4a"/>
    <rect x="-17" y="0" width="34" height="52" rx="5" fill="#3a6b4a"/>
    <rect x="-19" y="52" width="16" height="32" rx="5" fill="#3a6b4a"/>
    <rect x="3" y="52" width="16" height="32" rx="5" fill="#3a6b4a"/>
    <ellipse cx="0" cy="18" rx="11" ry="16" fill="#2d5a3d"/>
  </g>
  
  <!-- Man 3 - Bottom right -->
  <g transform="translate(480, 420)">
    <ellipse cx="0" cy="75" rx="28" ry="8" fill="#000" opacity="0.2"/>
    <circle cx="0" cy="-20" r="20" fill="#3a6b4a"/>
    <rect x="-16" y="2" width="32" height="48" rx="5" fill="#3a6b4a"/>
    <rect x="-18" y="50" width="15" height="30" rx="5" fill="#3a6b4a"/>
    <rect x="3" y="50" width="15" height="30" rx="5" fill="#3a6b4a"/>
    <ellipse cx="0" cy="20" rx="10" ry="15" fill="#2d5a3d"/>
  </g>
  
  <!-- Man 4 - Bottom center -->
  <g transform="translate(400, 450)">
    <ellipse cx="0" cy="72" rx="28" ry="8" fill="#000" opacity="0.2"/>
    <circle cx="0" cy="-18" r="20" fill="#4a7b5a"/>
    <rect x="-16" y="4" width="32" height="46" rx="5" fill="#4a7b5a"/>
    <rect x="-18" y="50" width="15" height="28" rx="5" fill="#4a7b5a"/>
    <rect x="3" y="50" width="15" height="28" rx="5" fill="#4a7b5a"/>
    <ellipse cx="0" cy="22" rx="10" ry="14" fill="#3a6b4a"/>
  </g>
  
  <!-- Man 5 - Bottom left -->
  <g transform="translate(320, 420)">
    <ellipse cx="0" cy="75" rx="28" ry="8" fill="#000" opacity="0.2"/>
    <circle cx="0" cy="-20" r="20" fill="#3a6b4a"/>
    <rect x="-16" y="2" width="32" height="48" rx="5" fill="#3a6b4a"/>
    <rect x="-18" y="50" width="15" height="30" rx="5" fill="#3a6b4a"/>
    <rect x="3" y="50" width="15" height="30" rx="5" fill="#3a6b4a"/>
    <ellipse cx="0" cy="20" rx="10" ry="15" fill="#2d5a3d"/>
  </g>
  
  <!-- Man 6 - Left -->
  <g transform="translate(270, 320)">
    <ellipse cx="0" cy="80" rx="28" ry="8" fill="#000" opacity="0.2"/>
    <circle cx="0" cy="-22" r="21" fill="#3a6b4a"/>
    <rect x="-17" y="0" width="34" height="52" rx="5" fill="#3a6b4a"/>
    <rect x="-19" y="52" width="16" height="32" rx="5" fill="#3a6b4a"/>
    <rect x="3" y="52" width="16" height="32" rx="5" fill="#3a6b4a"/>
    <ellipse cx="0" cy="18" rx="11" ry="16" fill="#2d5a3d"/>
  </g>
  
  <!-- Cross/Light in center -->
  <g transform="translate(400, 350)" opacity="0.6">
    <rect x="-3" y="-40" width="6" height="80" fill="#c19a3d"/>
    <rect x="-25" y="-3" width="50" height="6" fill="#c19a3d"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#c19a3d" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Scripture -->
  <text x="400" y="560" font-family="Georgia, serif" font-size="22" fill="#c19a3d" 
        text-anchor="middle" font-style="italic">
    "Where two or three gather in My name, I am there"
  </text>
</svg>