<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Prayer Meeting -->
  <defs>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4d2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6914;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#warmLight)"/>
  
  <!-- Room walls suggestion -->
  <rect x="50" y="400" width="700" height="200" fill="#0a0f11" opacity="0.5"/>
  <rect x="50" y="100" width="20" height="500" fill="#0a0f11" opacity="0.3"/>
  <rect x="730" y="100" width="20" height="500" fill="#0a0f11" opacity="0.3"/>
  
  <!-- Altar/Table in center -->
  <g transform="translate(400, 380)">
    <rect x="-80" y="-20" width="160" height="40" fill="#8b6914"/>
    <rect x="-85" y="-25" width="170" height="10" fill="#c19a3d"/>
    <rect x="-70" y="-20" width="140" height="3" fill="#c19a3d" opacity="0.6"/>
  </g>
  
  <!-- Candles on altar -->
  <g transform="translate(350, 365)">
    <rect x="-3" y="-25" width="6" height="25" fill="#f5deb3"/>
    <ellipse cx="0" cy="-27" rx="4" ry="2" fill="#ffa500"/>
    <ellipse cx="0" cy="-30" rx="6" ry="4" fill="#ffa500" opacity="0.5"/>
  </g>
  <g transform="translate(450, 365)">
    <rect x="-3" y="-25" width="6" height="25" fill="#f5deb3"/>
    <ellipse cx="0" cy="-27" rx="4" ry="2" fill="#ffa500"/>
    <ellipse cx="0" cy="-30" rx="6" ry="4" fill="#ffa500" opacity="0.5"/>
  </g>
  
  <!-- Cross on altar -->
  <g transform="translate(400, 350)">
    <rect x="-2" y="-30" width="4" height="40" fill="#c19a3d"/>
    <rect x="-12" y="-18" width="24" height="4" fill="#c19a3d"/>
  </g>
  
  <!-- Men standing in prayer around altar -->
  
  <!-- Man 1 - Left front -->
  <g transform="translate(280, 340)">
    <ellipse cx="0" cy="105" rx="30" ry="8" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-25" r="22" fill="#2d5a3d"/>
    <rect x="-18" y="-2" width="36" height="65" rx="5" fill="#2d5a3d"/>
    <rect x="-20" y="63" width="17" height="45" rx="5" fill="#2d5a3d"/>
    <rect x="3" y="63" width="17" height="45" rx="5" fill="#2d5a3d"/>
    <!-- Hands in prayer -->
    <ellipse cx="0" cy="20" rx="12" ry="16" fill="#1a4d2e"/>
  </g>
  
  <!-- Man 2 - Right front -->
  <g transform="translate(520, 340)">
    <ellipse cx="0" cy="105" rx="30" ry="8" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-25" r="22" fill="#3a6b4a"/>
    <rect x="-18" y="-2" width="36" height="65" rx="5" fill="#3a6b4a"/>
    <rect x="-20" y="63" width="17" height="45" rx="5" fill="#3a6b4a"/>
    <rect x="3" y="63" width="17" height="45" rx="5" fill="#3a6b4a"/>
    <ellipse cx="0" cy="20" rx="12" ry="16" fill="#2d5a3d"/>
  </g>
  
  <!-- Man 3 - Left back -->
  <g transform="translate(220, 310)" opacity="0.85">
    <ellipse cx="0" cy="95" rx="28" ry="7" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-22" r="20" fill="#3a6b4a"/>
    <rect x="-16" y="0" width="32" height="58" rx="5" fill="#3a6b4a"/>
    <rect x="-18" y="58" width="15" height="40" rx="5" fill="#3a6b4a"/>
    <rect x="3" y="58" width="15" height="40" rx="5" fill="#3a6b4a"/>
    <ellipse cx="0" cy="18" rx="11" ry="14" fill="#2d5a3d"/>
  </g>
  
  <!-- Man 4 - Right back -->
  <g transform="translate(580, 310)" opacity="0.85">
    <ellipse cx="0" cy="95" rx="28" ry="7" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-22" r="20" fill="#4a7b5a"/>
    <rect x="-16" y="0" width="32" height="58" rx="5" fill="#4a7b5a"/>
    <rect x="-18" y="58" width="15" height="40" rx="5" fill="#4a7b5a"/>
    <rect x="3" y="58" width="15" height="40" rx="5" fill="#4a7b5a"/>
    <ellipse cx="0" cy="18" rx="11" ry="14" fill="#3a6b4a"/>
  </g>
  
  <!-- Man 5 - Center back, hands raised -->
  <g transform="translate(400, 290)" opacity="0.8">
    <ellipse cx="0" cy="100" rx="28" ry="7" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-24" r="21" fill="#3a6b4a"/>
    <rect x="-17" y="0" width="34" height="60" rx="5" fill="#3a6b4a"/>
    <rect x="-19" y="60" width="16" height="43" rx="5" fill="#3a6b4a"/>
    <rect x="3" y="60" width="16" height="43" rx="5" fill="#3a6b4a"/>
    <!-- Arms raised -->
    <rect x="-32" y="-45" width="13" height="50" rx="5" fill="#3a6b4a" transform="rotate(-45 -25.5 -20)"/>
    <rect x="19" y="-45" width="13" height="50" rx="5" fill="#3a6b4a" transform="rotate(45 25.5 -20)"/>
  </g>
  
  <!-- Light rays from above altar -->
  <g opacity="0.3">
    <line x1="400" y1="100" x2="380" y2="360" stroke="#c19a3d" stroke-width="30"/>
    <line x1="400" y1="100" x2="420" y2="360" stroke="#c19a3d" stroke-width="30"/>
    <line x1="400" y1="100" x2="400" y2="360" stroke="#fff" stroke-width="15"/>
  </g>
  
  <!-- Scripture -->
  <text x="400" y="560" font-family="Georgia, serif" font-size="20" fill="#c19a3d" 
        text-anchor="middle" font-style="italic">
    "Building an altar for God where He meets with men"
  </text>
</svg>