<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="unity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4d2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d5a3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a4d2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#unity)"/>
  
  <!-- Ground -->
  <rect y="450" width="800" height="150" fill="#0f1419" opacity="0.6"/>
  
  <!-- Group of men standing together, arms around each other - Brotherhood -->
  
  <!-- Man 1 - Far Left -->
  <g transform="translate(200, 320)">
    <ellipse cx="0" cy="120" rx="32" ry="8" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-28" r="24" fill="#2d5a3d"/>
    <rect x="-19" y="-4" width="38" height="70" rx="5" fill="#2d5a3d"/>
    <rect x="-22" y="66" width="18" height="60" rx="5" fill="#2d5a3d"/>
    <rect x="4" y="66" width="18" height="60" rx="5" fill="#2d5a3d"/>
    <!-- Arm around next person -->
    <rect x="15" y="0" width="14" height="45" rx="5" fill="#2d5a3d" transform="rotate(20 22 22.5)"/>
  </g>
  
  <!-- Man 2 - Center Left -->
  <g transform="translate(310, 315)">
    <ellipse cx="0" cy="123" rx="33" ry="8" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-30" r="25" fill="#3a6b4a"/>
    <rect x="-20" y="-5" width="40" height="72" rx="5" fill="#3a6b4a"/>
    <rect x="-23" y="67" width="19" height="62" rx="5" fill="#3a6b4a"/>
    <rect x="4" y="67" width="19" height="62" rx="5" fill="#3a6b4a"/>
    <!-- Arms on both neighbors -->
    <rect x="-30" y="0" width="14" height="45" rx="5" fill="#3a6b4a" transform="rotate(-20 -23 22.5)"/>
    <rect x="16" y="0" width="14" height="45" rx="5" fill="#3a6b4a" transform="rotate(25 23 22.5)"/>
  </g>
  
  <!-- Man 3 - Center (tallest) -->
  <g transform="translate(420, 305)">
    <ellipse cx="0" cy="130" rx="34" ry="8" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-32" r="26" fill="#4a7b5a"/>
    <rect x="-21" y="-7" width="42" height="75" rx="5" fill="#4a7b5a"/>
    <rect x="-24" y="68" width="20" height="65" rx="5" fill="#4a7b5a"/>
    <rect x="4" y="68" width="20" height="65" rx="5" fill="#4a7b5a"/>
    <!-- Arms on both neighbors -->
    <rect x="-32" y="2" width="14" height="48" rx="5" fill="#4a7b5a" transform="rotate(-25 -25 26)"/>
    <rect x="18" y="2" width="14" height="48" rx="5" fill="#4a7b5a" transform="rotate(25 25 26)"/>
  </g>
  
  <!-- Man 4 - Center Right -->
  <g transform="translate(530, 315)">
    <ellipse cx="0" cy="123" rx="33" ry="8" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-30" r="25" fill="#3a6b4a"/>
    <rect x="-20" y="-5" width="40" height="72" rx="5" fill="#3a6b4a"/>
    <rect x="-23" y="67" width="19" height="62" rx="5" fill="#3a6b4a"/>
    <rect x="4" y="67" width="19" height="62" rx="5" fill="#3a6b4a"/>
    <!-- Arms on both neighbors -->
    <rect x="-30" y="0" width="14" height="45" rx="5" fill="#3a6b4a" transform="rotate(-25 -23 22.5)"/>
    <rect x="16" y="0" width="14" height="45" rx="5" fill="#3a6b4a" transform="rotate(20 23 22.5)"/>
  </g>
  
  <!-- Man 5 - Far Right -->
  <g transform="translate(640, 320)">
    <ellipse cx="0" cy="120" rx="32" ry="8" fill="#000" opacity="0.3"/>
    <circle cx="0" cy="-28" r="24" fill="#2d5a3d"/>
    <rect x="-19" y="-4" width="38" height="70" rx="5" fill="#2d5a3d"/>
    <rect x="-22" y="66" width="18" height="60" rx="5" fill="#2d5a3d"/>
    <rect x="4" y="66" width="18" height="60" rx="5" fill="#2d5a3d"/>
    <!-- Arm around previous person -->
    <rect x="-29" y="0" width="14" height="45" rx="5" fill="#2d5a3d" transform="rotate(-20 -22 22.5)"/>
  </g>
  
  <!-- Unity circle above them -->
  <g transform="translate(420, 180)" opacity="0.5">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#c19a3d" stroke-width="4"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#c19a3d" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="#c19a3d" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Light connecting them -->
  <g opacity="0.3">
    <line x1="200" y1="300" x2="640" y2="300" stroke="#c19a3d" stroke-width="15"/>
    <line x1="200" y1="300" x2="640" y2="300" stroke="#fff" stroke-width="5"/>
  </g>
  
  <!-- Scripture -->
  <text x="420" y="540" font-family="Georgia, serif" font-size="22" fill="#c19a3d" 
        text-anchor="middle" font-style="italic">
    "Not in isolation, but in brotherhood"
  </text>
  <text x="420" y="570" font-family="Georgia, serif" font-size="18" fill="#8b6914" 
        text-anchor="middle" font-style="italic">
    "Iron sharpens iron, so one man sharpens another"
  </text>
</svg>